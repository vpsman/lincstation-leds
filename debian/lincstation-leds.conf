# lincstation-leds configuration. Apply changes with: systemctl restart lincstation-leds

# Disk slots. Each disk LED lights for the drive whose sysfs path,
#   readlink -f /sys/block/<dev>/device
# contains the given path components: the SATA port for the 2.5" bays,
# the PCIe root port for the M.2 slots. Drives in unlisted slots are ignored;
# the service log lists every drive it finds and the LED it chose.
hdd0 = 0000:00:17.0/ata1
hdd1 = 0000:00:17.0/ata2
# The N2's four M.2 slots sit on root ports 1c.3, 1c.6, 1d.0 and 1d.1. ata1/ata2 and
# NVMe 1/2 are confirmed on a populated unit; NVMe 3/4 assume the port order continues.
nvme1 = 0000:00:1c.3
nvme2 = 0000:00:1c.6
nvme3 = 0000:00:1d.0
nvme4 = 0000:00:1d.1

# Network LED: "auto" picks the physical NIC (enp1s0 on pve3).
net_iface = auto
# Traffic below this many bytes per second leaves the LED steady.
net_threshold = 16384

# Status LED colours: white, orange (the red element), pink (white+red) or off.
# Power LED colour.
power = white
# Healthy disks are steady white and blink to this colour on I/O.
disk_activity = off

# RGB strip by the worst pool state, as MODE R G B BRIGHTNESS (0-255 each).
# MODE is solid, breath or loop. Loop alternates two colours (loop R G B R G B BRIGHTNESS),
# or flashes one colour on and off (loop R G B BRIGHTNESS).
strip_ok       = solid  240 0 220 12            # all pools ONLINE
strip_scrub    = breath 240 0 220 16            # a scrub is running
strip_errors   = solid  255 40 0 255            # ONLINE, but read/write/checksum or data errors counted
strip_resilver = loop   255 40 0 240 0 220 255  # a resilver is running
strip_degraded = breath 255 40 0 255            # a pool is DEGRADED
strip_locked   = loop   255 0 0 255 40 0 255    # an encryption key is not loaded
strip_fault    = breath 255 0 0 255             # a pool is FAULTED/UNAVAIL/SUSPENDED

# Sampling: LED update interval, and how often to run "zpool status".
interval_ms = 100
zfs_interval_s = 10
